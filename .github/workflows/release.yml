name: Release GBOS artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>; got $tag" >&2
            exit 1
          fi
          configured_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [[ "$configured_version" != "$version" ]]; then
            echo "Tag $tag does not match build.gradle.kts version $configured_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: ./gradlew clean verifyArtifactLayout verifyJavaTargetMetadata jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/libs/build-observability-schema-${{ steps.release.outputs.version }}.jar" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
